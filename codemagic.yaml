workflows:
  android-workflow:
    name: Android Build
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Regenerate Android platform
        script: |
          flutter create --platforms=android .
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
